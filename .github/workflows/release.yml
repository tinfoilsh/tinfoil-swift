name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Check SDK version matches tag
        run: |
          version=$(sed -nE 's/^ *public static let sdkVersion = "([^"]+)"$/\1/p' Sources/TinfoilAI/Constants.swift)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::TinfoilConstants.sdkVersion is '$version' but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a pre-release suffix, such as v0.9.0-rc.1, is published
          # as a pre-release so it is never marked as the latest release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
