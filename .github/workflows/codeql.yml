name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Analyze (swift)
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # CodeQL traces every process the build starts, which slows SwiftPM's
      # git-heavy resolution and the dependencies' compilation many times
      # over. Do both before tracing begins, so only the SDK's own sources
      # are compiled, and extracted, under the tracer.
      - name: Build dependencies
        run: |
          swift package resolve
          swift build --product OpenAI
          swift build --product EHBP

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual

      # CodeQL's Swift extractor ships x86_64 only, so on Apple Silicon the
      # tracer falls back to the x86_64 slices of the system binaries it
      # injects into (/bin/bash, /usr/bin/xcrun), and everything they spawn
      # inherits that. A plain `swift build` would run SwiftPM under Rosetta
      # and build for x86_64, ignoring the arm64 dependencies built above.
      # Launching the toolchain's own swift with `arch -arm64`, with Xcode's
      # toolchain first on PATH, keeps SwiftPM and the compiler native; only
      # the extractor runs under Rosetta. See dfed/SafeDI#325.
      - name: Build the SDK
        run: |
          DEVELOPER_DIR=$(xcode-select -p)
          TOOLCHAIN="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          export PATH="$TOOLCHAIN:$DEVELOPER_DIR/usr/bin:$PATH"
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          arch -arm64 "$TOOLCHAIN/swift" build --target TinfoilAI

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift

  actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
